name: Bot Casas Asturias v8
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Ensure folders exist
        run: |
          mkdir -p debug/html debug/screenshots
          if [ ! -f seen_ads.json ]; then echo '{}' > seen_ads.json; fi
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bot-casas-debug-v8
          path: |
            debug/debug_report.json
            debug/html/*.html
            debug/screenshots/*.png
          if-no-files-found: warn
      - name: Commit state and debug artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update bot state and debug artifacts"
          file_pattern: seen_ads.json debug/debug_report.json debug/html/*.html debug/screenshots/*.png
