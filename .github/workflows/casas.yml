name: Scraping Casas Asturias → Telegram

on:
  schedule:
    - cron: '0 8 * * *'      # 10:00 CEST
  workflow_dispatch:

permissions:
  contents: write   # ← Esto es clave

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # recomendado

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Guardar seen_ads.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update seen_ads.json (nuevos anuncios)"
