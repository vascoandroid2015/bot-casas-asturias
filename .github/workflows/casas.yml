name: Bot Casas Asturias

on:
  schedule:
    - cron: "0 */3 * * *"      # Ejecuta cada 3 horas (a las 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
  workflow_dispatch:           # Permite ejecutar manualmente

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Necesario para el commit posterior

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Guardar seen_ads.json (solo si hubo cambios)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update seen_ads.json - Nuevos anuncios procesados"
          file_pattern: seen_ads.json
